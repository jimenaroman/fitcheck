[project]
name = "personal"
version = "0.1.0"
description = "Personal agent. First module: fitcheck, a resume-vs-posting fit checker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.13.5",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
fitcheck = "fitcheck.cli:main"

[project.optional-dependencies]
gemini = [
    "google-genai>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
