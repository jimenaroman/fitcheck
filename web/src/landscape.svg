x="23.4" y="19.8" width="1.8" height="1.8" fill="#1E222B"/><rect x="3.6" y="21.6" width="1.8" height="1.8" fill="#F2CF9A"/><rect x="5.4" y="21.6" width="1.8" height="1.8" fill="#1E222B"/><rect x="7.2" y="21.6" width="1.8" height="1.8" fill="#2E3544"/><rect x="9.0" y="21.6" width="3.6" height="1.8" fill="#1E222B"/><rect x="12.6" y="21.6" width="1.8" height="1.8" fill="#2E3544"/><rect x="14.4" y="21.6" width="5.4" height="1.8" fill="#1E222B"/><rect x="23.4" y="21.6" width="1.8" height="1.8" fill="#1E222B"/><rect x="3.6" y="23.4" width="1.8" height="1.8" fill="#F2CF9A"/><rect x="5.4" y="23.4" width="7.2" height="1.8" fill="#1E222B"/><rect x="12.6" y="23.4" width="1.8" height="1.8" fill="#2E3544"/><rect x="14.4" y="23.4" width="1.8" height="1.8" fill="#1E222B"/><rect x="18.0" y="23.4" width="3.6" height="1.8" fill="#1E222B"/><rect x="23.4" y="23.4" width="1.8" height="1.8" fill="#1E222B"/><rect x="3.6" y="25.2" width="9.0" height="1.8" fill="#1E222B"/><rect x="12.6" y="25.2" width="1.8" height="1.8" fill="#2E3544"/><rect x="14.4" y="25.2" width="1.8" height="1.8" fill="#1E222B"/><rect x="19.8" y="25.2" width="7.2" height="1.8" fill="#1E222B"/><rect x="3.6" y="27.0" width="9.0" height="1.8" fill="#1E222B"/><rect x="12.6" y="27.0" width="1.8" height="1.8" fill="#2E3544"/><rect x="14.4" y="27.0" width="1.8" height="1.8" fill="#1E222B"/><rect x="21.6" y="27.0" width="5.4" height="1.8" fill="#1E222B"/><rect x="3.6" y="28.8" width="12.6" height="1.8" fill="#2E3544"/><rect x="23.4" y="28.8" width="1.8" height="1.8" fill="#1E222B"/><rect x="3.6" y="30.6" width="12.6" height="1.8" fill="#1E222B"/><rect x="23.4" y="30.6" width="1.8" height="1.8" fill="#1E222B"/><rect x="5.4" y="32.4" width="1.8" height="1.8" fill="#F2CF9A"/><rect x="7.2" y="32.4" width="1.8" height="1.8" fill="#1E222B"/><rect x="10.8" y="32.4" width="3.6" height="1.8" fill="#1E222B"/><rect x="23.4" y="32.4" width="1.8" height="1.8" fill="#1E222B"/><rect x="5.4" y="34.2" width="1.8" height="1.8" fill="#F2CF9A"/><r