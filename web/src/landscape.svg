<svg class="land" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dusk above a sea of clouds; an 8-bit climber in alpine gear stands on a dark peak in the foreground">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--sky-1)"/>
      <stop offset=".42" style="stop-color: var(--sky-2)"/>
      <stop offset=".64" style="stop-color: var(--sky-3)"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0" cy="540" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8EA" stop-opacity="1"/>
      <stop offset=".25" stop-color="#FCEBCB" stop-opacity=".75"/>
      <stop offset="1" stop-color="#F6E2C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cloudSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4E4C6"/>
      <stop offset="1" stop-color="#DCCDB8"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#353C4A"/>
      <stop offset="1" stop-color="#1E222B"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="haze" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <rect width="390" height="844" fill="url(#skyGrad)"/>

  <!-- Low sun glowing from the left, with faint rays -->
  <rect width="390" height="844" fill="url(#sunGlow)"/>
  <g opacity=".9">
    <polygon points="-10,540 420,250 420,300" fill="url(#ray)"/>
    <polygon points="-10,540 420,360 420,385" fill="url(#ray)"/>
    <polygon points="-10,540 420,150 420,185" fill="url(#ray)" opacity=".6"/>
    <polygon points="-10,540 420,440 420,455" fill="url(#ray)" opacity=".7"/>
  </g>

  <!-- High wisps (drift) -->
  <g class="drift" filter="url(#soft)" opacity=".55">
    <ellipse cx="300" cy="300" rx="70" ry="5" fill="#FFFFFF"/>
    <ellipse cx="90" cy="345" rx="60" ry="4" fill="#FFFFFF"/>
  </g>

  <!-- Sea of clouds at the horizon -->
  <rect x="-10" y="532" width="410" height="120" fill="url(#cloudSea)"/>
  <rect x="-10" y="528" width="410" height="8" fill="#FBF0DA" filter="url(#soft)"/>
  <g class="drift slow" filter="url(#soft)">
    <ellipse cx="60" cy="556" rx="90" ry="9" fill="#FFF7E8" opacity=".8"/>
    <ellipse cx="250" cy="566" rx="120" ry="8" fill="#FFF7E8" opacity=".7"/>
    <ellipse cx="160" cy="590" rx="110" ry="9" fill="#EADBC3" opacity=".9"/>
    <ellipse cx="340" cy="548" rx="70" ry="6" fill="#FFF7E8" opacity=".7"/>
  </g>
  <g class="drift" filter="url(#soft)" opacity=".8">
    <ellipse cx="120" cy="572" rx="40" ry="7" fill="#FFFFFF"/>
    <ellipse cx="190" cy="574" rx="26" ry="6" fill="#FFFFFF"/>
  </g>

  <!-- Distant hazy ranges, no snow -->
  <path filter="url(#haze)" d="M230,640 C262,616 290,600 316,598 C330,590 344,574 360,572 C372,571 384,580 400,588 L400,700 L230,700 Z" fill="#A8B0BE"/>
  <path filter="url(#haze)" d="M-10,612 C20,604 44,596 62,602 C84,610 104,628 140,636 C170,644 196,650 226,664 L226,720 L-10,720 Z" fill="#9AA3B3"/>
  <path d="M-10,660 C30,646 66,640 96,648 C126,656 150,676 190,690 L190,844 L-10,844 Z" fill="#7C879A"/>
  <path d="M250,690 C290,668 326,650 356,646 C372,644 386,650 400,656 L400,844 L250,844 Z" fill="#6E798D"/>
  <path d="M-10,724 C40,706 80,708 120,720 C150,730 172,748 196,770 L196,844 L-10,844 Z" fill="#5A6476"/>

  <!-- Close foreground peak: dark rock silhouette, peak just in frame -->
  <path d="M-10,778 C30,760 70,748 110,736 C140,726 160,708 182,694 C196,684 206,672 216,664 C226,656 232,650 238,646 L243,640 C249,636 255,635 263,635.4 C268,635.8 272,636.8 275,639.5 L280,644 C286,648 290,652 294,656 C308,664 320,670 334,682 C350,696 370,708 400,716 L400,844 L-10,844 Z" fill="url(#rock)"/>
  <!-- Warm rim light on the sun-facing edge -->
  <path d="M-10,778 C30,760 70,748 110,736 C140,726 160,708 182,694 C196,684 206,672 216,664 C226,656 232,650 238,646 L243,640 C249,636 255,635 263,635.4" fill="none" stroke="#E8C28E" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
  <!-- Soft shadow side and a few rock seams -->
  <path d="M268,635.8 C272,636.8 275,639.5 280,644 C286,648 290,652 294,656 C308,664 320,670 334,682 C350,696 370,708 400,716 L400,844 L300,844 C300,760 286,690 268,635.8 Z" fill="#191C24" opacity=".45"/>
  <path d="M150,740 C172,726 190,712 204,698" stroke="#4A5262" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".5"/>
  <path d="M60,780 C84,772 104,764 120,754" stroke="#4A5262" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".4"/>

  <!-- ===== 8-bit climber ===== -->
  <g transform="translate(257 637)" shape-rendering="crispEdges">
    <!-- 8-bit climber sprite (20 x 26 px, 1.8 units per pixel). Feet center at (0,0).
         Pose: one hand shading the eyes, the other gripping the flag pole in a dark glove, rope coiled at the base. -->
    <g transform="translate(-9.9 -46.8)">
      <g class="px-flag-a"><rect x="23.4" y="0.0" width="7.2" height="1.8" fill="#1E222B"/><rect x="23.4" y="1.8" width="10.8" height="1.8" fill="#1E222B"/><rect x="23.4" y="3.6" width="10.8" height="1.8" fill="#1E222B"/><rect x="23.4" y="5.4" width="7.2" height="1.8" fill="#1E222B"/></g>
      <g class="px-flag-b"><rect x="23.4" y="0.0" width="9.0" height="1.8" fill="#1E222B"/><rect x="23.4" y="1.8" width="10.8" height="1.8" fill="#1E222B"/><rect x="23.4" y="3.6" width="7.2" height="1.8" fill="#1E222B"/><rect x="23.4" y="5.4" width="3.6" height="1.8" fill="#1E222B"/></g>
